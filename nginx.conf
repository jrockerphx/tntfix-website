# tntfix.com - nginx site config (copied over the image's default.conf by the Dockerfile)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pages, styles and scripts: browsers must re-check on every visit.
    # Unchanged files come back as a tiny 304, so this costs almost nothing,
    # and visitors always see the latest deploy (no stale "Send a Question" links).
    location ~* \.(html?|css|js|xml|txt)$ {
        add_header Cache-Control "no-cache" always;
    }

    # Images, video and fonts rarely change: let browsers keep them for a week.
    location ~* \.(png|jpe?g|gif|webp|svg|ico|mp4|webm|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800" always;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
